# One-command local stack: `docker compose up --build`.
#
# PostgreSQL and RabbitMQ are private to the Compose network. The API is the
# only published port; use `docker compose exec` for psql/rabbitmqctl checks.
# The one-shot `migrate` service must finish before the API starts.
name: ctrlplane

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ctrlplane:local
  environment:
    APP_ENV: compose
    LOG_LEVEL: info
    HTTP_ADDR: ":8090"
    DATABASE_URL: postgres://ctrlplane:ctrlplane@postgres:5432/saas_task?sslmode=disable&search_path=app
    AMQP_URL: amqp://ctrlplane:ctrlplane@rabbitmq:5672/
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctrlplane
      POSTGRES_PASSWORD: ctrlplane
      POSTGRES_DB: saas_task
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctrlplane -d saas_task"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ctrlplane
      RABBITMQ_DEFAULT_PASS: ctrlplane
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  migrate:
    <<: *app
    restart: "on-failure:5"
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["/app/api"]
    ports:
      - "${API_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    stop_grace_period: 20s

  worker:
    <<: *app
    command:
      - /app/worker
      - --min-delay
      - 200ms
      - --max-delay
      - 800ms
      - --worker-id
      - compose-1
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    stop_grace_period: 20s

  # `make test` starts this service explicitly. It is kept out of the normal
  # `docker compose up` stack because it runs once and exits.
  test:
    profiles: ["test"]
    image: golang:1.26.2
    working_dir: /src
    volumes:
      - .:/src:ro
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://ctrlplane:ctrlplane@postgres:5432/saas_task_test?sslmode=disable
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        gofmt -l . > /tmp/gofmt.out
        if [ -s /tmp/gofmt.out ]; then
          echo "gofmt required:"
          cat /tmp/gofmt.out
          exit 1
        fi
        go vet ./...
        go mod tidy -diff
        go test ./... -count=1 -race

volumes:
  pgdata:
  rabbitmqdata:
  gomodcache:
  gocache:
